name: CI

on:
  push:
    branches: [main, master, "NazmulHudaNabil/**"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://test_user:test_pass@localhost:5432/test_db?sslmode=disable"
          NEXT_TELEMETRY_DISABLED: 1
